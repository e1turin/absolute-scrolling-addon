name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release after its Build workflow succeeds (for example, v0.3.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Get tagged commit
        id: tag_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Find successful build for tag
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow build.yml \
            --commit "${{ steps.tag_commit.outputs.sha }}" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::No successful Build workflow run exists for ${{ inputs.tag }}. Push the tag or run Build manually, then retry this release."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download built archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download \
            --repo "${{ github.repository }}" \
            "${{ steps.build.outputs.run_id }}" \
            --name extension-package \
            --dir release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" release-assets/*.zip --verify-tag --generate-notes
