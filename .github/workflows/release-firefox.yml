name: Release Firefox

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build, sign with AMO, and release (for example, v0.4.0)"
        required: true
        type: string

permissions:
  contents: read

# Both browser releases may add assets to the same tag without racing creation.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-firefox.yml
    with:
      tag: ${{ inputs.tag }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out built commit for signing tools
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.commit }}

      - name: Download Firefox archive from this run
        uses: actions/download-artifact@v5
        with:
          name: firefox-bundle
          path: build-artifact

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install signing tools
        run: npm ci

      - name: Sign built archive through AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          test -n "$WEB_EXT_API_KEY" && test -n "$WEB_EXT_API_SECRET" || {
            echo "::error::Set the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets before running Release Firefox."
            exit 1
          }
          unzip -q build-artifact/*.zip -d signing-source
          npx --no-install web-ext sign \
            --source-dir signing-source \
            --artifacts-dir signed-assets \
            --channel unlisted

      - name: Upload signed Firefox bundle
        uses: actions/upload-artifact@v5
        with:
          name: firefox-signed-bundle
          path: signed-assets/*.xpi
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" signed-assets/*.xpi --clobber
          else
            gh release create "$RELEASE_TAG" signed-assets/*.xpi --verify-tag --generate-notes
          fi
