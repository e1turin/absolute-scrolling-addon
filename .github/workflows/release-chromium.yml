name: Release Chromium

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build, sign as CRX, and release (for example, v0.4.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-chromium.yml
    with:
      tag: ${{ inputs.tag }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download Chromium bundle from this run
        uses: actions/download-artifact@v5
        with:
          name: chromium-bundle
          path: dist/chromium

      - name: Sign Chromium CRX
        env:
          CHROMIUM_PRIVATE_KEY: ${{ secrets.CHROMIUM_PRIVATE_KEY }}
        run: |
          test -n "$CHROMIUM_PRIVATE_KEY" || {
            echo "::error::Set the CHROMIUM_PRIVATE_KEY repository secret to your PKCS#8 PEM signing key before running Release Chromium."
            exit 1
          }
          signing_dir=$(mktemp -d "$RUNNER_TEMP/chromium-signing.XXXXXX")
          trap 'rm -rf "$signing_dir"' EXIT
          umask 077
          printf '%s\n' "$CHROMIUM_PRIVATE_KEY" > "$signing_dir/key.pem"
          unset CHROMIUM_PRIVATE_KEY
          google-chrome --headless --no-sandbox --no-message-box \
            --user-data-dir="$signing_dir/profile" \
            --pack-extension="$GITHUB_WORKSPACE/dist/chromium" \
            --pack-extension-key="$signing_dir/key.pem"
          test -s dist/chromium.crx || {
            echo "::error::Chrome did not produce a signed CRX. Check the PEM key and Chrome output."
            exit 1
          }
          mkdir -p signed-assets
          mv dist/chromium.crx "signed-assets/absolute-scrolling-${RELEASE_TAG}-chromium.crx"

      - name: Package development ZIP
        working-directory: dist/chromium
        run: zip -q -r "../../signed-assets/absolute-scrolling-${RELEASE_TAG}-chromium.zip" .

      - name: Upload Chromium release bundles
        uses: actions/upload-artifact@v5
        with:
          name: chromium-release-bundles
          path: |
            signed-assets/*.crx
            signed-assets/*.zip
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" signed-assets/*.crx signed-assets/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" signed-assets/*.crx signed-assets/*.zip --verify-tag --generate-notes
          fi
