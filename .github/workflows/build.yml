name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build (for example, v0.3.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm tag matches package version
        run: |
          package_version=$(node -p "require('./package.json').version")
          expected_tag="v${package_version}"
          test "$RELEASE_TAG" = "$expected_tag" || {
            echo "::error::Tag $RELEASE_TAG does not match package version $expected_tag."
            exit 1
          }

      - name: Validate extension
        run: npm run lint

      - name: Build unsigned extension archive
        run: npm run build

      - name: Upload extension archive
        uses: actions/upload-artifact@v5
        with:
          name: extension-package
          path: dist/*.zip
          if-no-files-found: error
